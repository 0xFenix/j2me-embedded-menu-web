<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0f1115" />
  <meta http-equiv="refresh" content="5;url=https://tools.ezway.mobi" />
  <title>Website đã chuyển địa chỉ | EZWay Tools</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#1c3040,#0f1115 65%);color:#e5e7eb}
    main{width:min(100%,500px);padding:40px 30px;text-align:center;background:#171a21;border:1px solid #29303d;border-radius:22px;box-shadow:0 20px 70px #0005}
    .symbol{font-size:44px;margin-bottom:12px}h1{font-size:clamp(1.5rem,5vw,2rem);margin:0 0 14px}p{color:#a7b0be;line-height:1.7;margin:0 0 20px}
    a.button{display:block;padding:15px 20px;background:linear-gradient(110deg,#5eead4,#38bdf8);color:#07141c;font-weight:750;text-decoration:none;border-radius:12px;transition:filter .2s}a.button:hover{filter:brightness(1.12)}
    .url{color:#5eead4;overflow-wrap:anywhere}.small{font-size:.88rem;margin:20px 0 0}strong{color:#e5e7eb}
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">🚀</div>
    <h1>Chúng tôi đã chuyển nhà!</h1>
    <p>Công cụ ghép JAR và các tiện ích đã được chuyển sang nền tảng mới. Hãy truy cập <span class="url">tools.ezway.mobi</span> để tiếp tục sử dụng.</p>
    <a class="button" href="https://tools.ezway.mobi">Truy cập website mới →</a>
    <p class="small">Tự động chuyển hướng sau <strong><span id="countdown">5</span> giây</strong>…</p>
    <noscript><p class="small">Nếu trang không tự chuyển, hãy nhấn nút phía trên.</p></noscript>
  </main>
  <script>
    (() => {
      const destination = 'https://tools.ezway.mobi';
      let seconds = 5;
      const countdown = document.getElementById('countdown');
      const timer = setInterval(() => {
        seconds -= 1;
        countdown.textContent = String(seconds);
        if (seconds <= 0) {
          clearInterval(timer);
          window.location.replace(destination);
        }
      }, 1000);
    })();
  </script>
</body>
</html>
